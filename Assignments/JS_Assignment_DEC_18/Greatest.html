<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function findGreatest(){
            var a = parseInt(document.getElementById("t1").value);
            var b = parseInt(document.getElementById("t2").value);
            var c = parseInt(document.getElementById("t3").value);

            if(a > b && a > c){
                document.getElementById("result").innerText = a;
            } else if(b > a && b > c){
                document.getElementById("result").innerText = b;
            } else{
                document.getElementById("result").innerText = c;
            }
        }
    </script>
    <p>Enter Num 1</p>
    <input type="text" id="t1">
    <br>
    <p>Enter Num 2</p>
    <input type="text" id="t2">
    <br>
    <p>Enter Num 3</p>
    <input type="text" id="t3">
    <br>
    <br>
    <h1 id="result">res</h1>
    <input type="button" value="Find" id="b1" onclick="findGreatest()">
</body>
</html>
