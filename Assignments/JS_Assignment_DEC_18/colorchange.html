<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .c1{
            background-color: tomato;
        }
        .c2{
            background-color: aqua;
        }
        .c3{
            background-color: yellow;
        }
    </style>

    <script>
        function change(){
            var a = document.getElementById("s1").value;
            var b = document.getElementById("color");
            if(a == "tomato"){
                b.setAttribute("class", "c1");
            } else if(a == "aqua"){
                b.setAttribute("class", "c2");
            } else if(a == "yellow"){
                b.setAttribute("class", "c3");
            }
        }
    </script>
</head>
<body>
    <h1>Color Box</h1>
    <div id="color" style="border: 2px solid black; height: 300px; width: 400px;"></div>
    <h4>Select Color</h4>
    <select name="Color" id="s1" onchange="change()">
        <option value="">SELECT</option>
        <option value="tomato">Tomato</option>
        <option value="aqua">Aqua</option>
        <option value="yellow">Yellow</option>
    </select>
</body>
</html>
