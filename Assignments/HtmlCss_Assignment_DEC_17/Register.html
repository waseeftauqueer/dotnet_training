<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="RegisterDiv ">
    <form class="RegisterForm">
        <h2 style="text-decoration: underline;">Employee Details Form</h2>
        <label for="id">Employee ID</label>
        <input type="text" id="id" placeholder="Enter Employee ID">
        <label for="name">Employee Name</label>
        <input type="name" id="name" placeholder="Enter Name">
        <label for="dob">DOB</label>
        <input type="date" id="date" placeholder="Enter DOB">
        <label for="email">Email</label>
        <input type="email" placeholder="Enter Email">
        <label for="link">Personal Site Link</label>
        <input type="text" placeholder="Enter Personal Site">
        <label for="date">Week</label>
        <input type="week" name="Week" id="week">
        <label for="time">Time (Project Status)</label>
        <input type="time">
        <label for="color" id="color">Code</label>
        <input type="color">
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
