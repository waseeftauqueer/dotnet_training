<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function simpleInterest(){
            var a = parseInt(document.getElementById("t1").value);
            if(a < 13){
                document.getElementById("result").innerText = 13 - a;
            } else {
                document.getElementById("result").innerText = (13 - a) * (-2);
            }
            
        }
    </script>
    <p>Enter the Number</p>
    <input type="text" id="t1">
    <br><br>
    <h1 id="result"> ? </h1>
    <input type="button" value="Find" id="b1" onclick="simpleInterest()">
</body>
</html>
