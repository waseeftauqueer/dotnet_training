<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="jquery.js"></script>
    <style>
        .box {
            width: 150px;
            height: 100px;
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <div class="box"></div>

    <script>
        $(".box").mouseover(function() {
            $(this).css("background-color", "lightblue");
        }).mouseout(function() {
            $(this).css("background-color", "lightgray");
        });
    </script>

</body>
</html>
