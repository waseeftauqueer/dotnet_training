<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery H1 Background Example</title>
    <script src="jquery.js"></script>
    <style>
    </style>
</head>
<body>
    <div>
        <h1>H1 Text</h1>
<p>Paragraph Text</p>
    </div>
    <div>
        <h1>H1 Text</h1>
        <p>Paragraph Text</p>
        <h2>H2 Text</h2>
    </div>
    <h1>Outside</h1>
    <script>
            $('div > h1').css({"background-color" : "yellow"});
    </script>

</body>
</html>
