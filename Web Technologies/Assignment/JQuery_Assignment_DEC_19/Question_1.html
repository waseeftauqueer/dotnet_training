<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <script src="jquery.js"></script>
    <style>
        div {
            border: 1px solid #000;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div id="div1">
        <p>Tony Stark</p>
    </div>

    <div id="div2">
        <p>Thanos</p>
    </div>

    <button id="button">Copy Content</button>

    <script>
        $("#button").click(function () {
            var content = $("#div1").html();
            $("#div2").html(content);
        });
    </script>

</body>
</html>
