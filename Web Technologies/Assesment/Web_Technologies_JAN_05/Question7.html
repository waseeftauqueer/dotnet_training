<!DOCTYPE html>
<html>
<head>
    <script src="jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $("li").each(function(index,li) {
                $(li).prepend(index + " ");
            });
        });
    </script>
</head>
<body>

<ul>
    <li>Ronaldo</li>
    <li>Messi</li>
    <li>Pele</li>
    <li>Neymar</li>
    <li>Maradona</li>
</ul>

</body>
</html>
