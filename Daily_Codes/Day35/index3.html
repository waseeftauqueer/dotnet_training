<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("Display Some Output Here");
        var a = confirm("Some message goes here.");
        if(a == true){
            document.bgColor='red';
        }else{
            document.bgColor='blue';
        }

        var m = prompt("Enter the message : ");
        var n = prompt("Enter the message : ");
        document.write(parseInt(m) + parseInt(n));
    </script>
</body>
</html>
